  .card{width:100%;max-width:380px;background:#111827;border:1px solid rgba(255,255,255,.08);

  input:focus{border-color:#6c8cff}
  button{width:100%;margin-top:12px;padding:12px 14px;border:none;border-radius:10px;cursor:pointer;

  button:disabled{opacity:.6;cursor:wait}
  .err{color:#f87171;font-size:.82rem;margin-top:14px;min-height:1.2em}
