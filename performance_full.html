  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;

  .card{width:100%;max-width:380px;background:#111827;border:1px solid rgba(255,255,255,.08);

  .lock{font-size:1.8rem;margin-bottom:14px}

  input:focus{border-color:#6c8cff}
  button{width:100%;margin-top:12px;padding:12px 14px;border:none;border-radius:10px;cursor:pointer;
    background:linear-gradient(135deg,#6c8cff,#a78bfa);color:#fff;font-size:.95rem;font-weight:700;font-family:inherit}
  button:disabled{opacity:.6;cursor:wait}
  .err{color:#f87171;font-size:.82rem;margin-top:14px;min-height:1.2em}
  .foot{margin-top:20px;font-family:'JetBrains Mono',monospace;font-size:.66rem;color:#4d6080}
</style>
